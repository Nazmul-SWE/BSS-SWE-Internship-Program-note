
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire a Freelancer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <h3>Need to hire a freelancer?</h3>

        <p>
            Sign up, type in what you need and
            receive free quotes in seconds.
        </p>

        <form>
            <input
                type="text"
                name="project"
                placeholder="What do you need done?"
                required
            >

            <button type="submit">Post a Project</button>
        </form>

    </div>

</body>
</html>
