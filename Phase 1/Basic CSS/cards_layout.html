

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .header {
            background-color: darkblue;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .course {
            display: inline-block;
            width: 220px;
            min-height: 180px;
            background-color: white;
            padding: 15px;
            margin: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 3px 8px #ccc;
            text-align: left;
        }

        .course h3 {
            color: darkblue;
        }

        .tag {
            display: inline-block;
            background-color: lightgreen;
            padding: 5px 8px;
            border-radius: 4px;
        }

        .button {
            display: inline-block;
            background-color: blue;
            color: white;
            padding: 10px 15px;
           
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>My Learning Hub</h1>
        <p>Learn HTML and CSS</p>
    </div>

    <div class="container">

        <div class="course">
            <h3>HTML Basics</h3>
            <p>Learn HTML tags and page structure.</p>
            <span class="tag">Beginner</span>
            <p><a  class="button">Learn More</a></p>
        </div>

        <div class="course">
            <h3>CSS Basics</h3>
            <p>Learn colors, spacing and layouts.</p>
            <span class="tag">Beginner</span>
            <p><a  class="button">Learn More</a></p>
        </div>

        <div class="course">
            <h3>JavaScript</h3>
            <p>Learn basic programming concepts.</p>
            <span class="tag">Upcoming</span>
            <p><a  class="button">Learn More</a></p>
        </div>

    </div>

</body>
</html>
