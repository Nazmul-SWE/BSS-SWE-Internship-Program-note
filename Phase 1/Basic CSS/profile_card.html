
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        body {
            background-color: #f0f2f5;
        }

        .card {
            width: 300px;
            height: 220px;
            background-color: white;
            padding: 20px;
            border: 2px solid #ddd;
            margin: 50px auto;
            box-shadow: 0 4px 10px gray;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: #555;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>My Profile</h2>
        <p>Name: Nazmul</p>
        <p>Department: CSE</p>
        <button>View Profile</button>
    </div>

</body>
</html>
