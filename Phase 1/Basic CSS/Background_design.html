

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .color-box {
            height: 120px;
            background-color: lightgreen;
            padding: 15px;
            margin-bottom: 20px;
        }

        .image-box {
            height: 300px;
            padding: 20px;
            color: white;
            background-color: #333;

         
        }

        .repeat-box {
            height: 150px;
            border: 2px solid black;
       
        }
    </style>
</head>
<body>

    <h2>Background Color</h2>
    <div class="color-box">
        This is a color background.
    </div>

    <h2>Background Image</h2>
    <div class="image-box">
        <h2>Welcome to Nature</h2>
        <p>Explore the beauty of nature.</p>
    </div>

    <h2>Repeating Background</h2>
    <div class="repeat-box"></div>

</body>
</html>
