<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bono App | Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.jpg">
</head>

<body>
    <div class="Wrapper">
        <header class="header">
            <a href="index.html"><img class="logo" src="images/logo.png" alt="Bono App Logo"></a>
            <div class="header-right">
                <div>
                    <i class="fas fa-envelope"></i> nazmulmridha680@gmail.com
                </div>
                <div>
                    <i class="fas fa-phone"></i> 01641-350-241
                </div>
                <a href="#">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </div>
        </header>

        <main class="main-content">
            <form>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message"></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>
            <div class="text-container">
                <h1>Comming Soon For Every Devoloper</h1>
                <p>We are working hard to bring you an amazing experience. Stay tuned for updates and be the first to
                    know when we launch!</p>
            </div>
        </main>
    </div>
</body>

</html>
