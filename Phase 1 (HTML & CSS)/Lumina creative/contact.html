
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Lumina Creative</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon" href="images/logo.png">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container container-sm header-flex">

            <a href="index.html">
                <img src="images/logo.png" alt="Lumina Creative" class="logo">
            </a>

            <ul class="main-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="current">Contact</a></li>
            </ul>

        </div>
    </header>

    <!-- Contact Section -->
    <section class="contact-page">

        <div class="container container-sm">

            <h1>Contact <span class="bg-primary">Us</span></h1>

            <p class="contact-intro">
                Have a project in mind? Feel free to contact us.
                We would love to hear from you!
            </p>

            <div class="contact-layout">

                <!-- Contact Form -->
                <div class="contact-form">

                    <h2>Send Us a Message</h2>

                    <form>

                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name"
                                placeholder="Enter your name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" name="email"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject"
                                placeholder="Enter subject">
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message"
                                rows="5" placeholder="Write your message..."
                                required></textarea>
                        </div>

                        <button type="submit" class="contact-btn">
                            Send Message
                        </button>

                    </form>

                </div>

                <!-- Contact Information -->
                <div class="contact-details">

                    <h2>Get In Touch</h2>

                    <p>
                        <i class="fa-solid fa-phone"></i>
                        (555) 555-5555
                    </p>

                    <p>
                        <i class="fa-solid fa-envelope"></i>
                        contact@lumina.test
                    </p>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        10 Main St Boston MA
                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">

        <img src="images/logo.png" alt="Lumina Logo" class="footer-logo">

        <div class="contact">
            <h4>Contact Us</h4>
            <p>(555) 555-5555</p>
            <p>contact@lumina.test</p>
            <p>10 Main St Boston MA</p>
        </div>

        <div class="social">
            <h4>Follow Us</h4>

            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-pinterest"></i></a>
                <a href="#"><i class="fa-brands fa-tumblr"></i></a>
            </div>
        </div>

    </footer>

</body>
</html>
