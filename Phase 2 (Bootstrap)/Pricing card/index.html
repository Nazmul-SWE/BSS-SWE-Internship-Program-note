<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-lg rounded-4 bg-white">
                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="fw-bold mb-1">Free</h5>
                        <p class="small text-secondary mb-3">For Freelancers</p>
                        <h2 class="fw-bold mb-4">$0</h2>
                        <ul class="list-unstyled mb-auto">
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>Single User</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>10 Downloads Per Month</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>Faster Files</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>25 Custom Packs</li>
                        </ul>
                        <button type="button" class="btn btn-dark btn-sm rounded-pill w-100 mt-5">Subscribe</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-lg rounded-4 text-bg-dark">
                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="fw-bold mb-1">Pro</h5>
                        <p class="small text-light mb-3">For Agencies</p>
                        <h2 class="fw-bold mb-4">$100</h2>
                        <ul class="list-unstyled mb-auto">
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>Unlimited Users</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>Unlimited Downloads</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>Fully-Editable Files</li>
                            <li class="py-2 fw-medium"><span class="me-2 small">&#10003;</span>200+ Custom Packs</li>
                        </ul>
                        <button type="button" class="btn btn-light btn-sm rounded-pill w-100 mt-5">Subscribe</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
