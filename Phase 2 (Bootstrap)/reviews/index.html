<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Reviews</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 bg-body-tertiary">
                    <div class="card-body p-4">

                        <!-- Heading + average rating -->
                        <div class="d-flex justify-content-between align-items-start gap-3 mb-5">
                            <h4 class="fw-bold lh-sm mt-2">What others think about the product</h4>
                            <div class="bg-white border rounded-3 text-center px-3 py-3 flex-shrink-0">
                                <div class="d-flex align-items-center justify-content-center gap-2">
                                    <span class="text-warning fs-2 lh-1">&#9733;</span>
                                    <span class="fs-2 fw-semibold">4.8</span>
                                </div>
                                <small class="fw-medium">Average Rating</small>
                            </div>
                        </div>

                        <!-- Search -->
                        <div class="input-group rounded-pill border mb-5 bg-white overflow-hidden">
                            <span class="input-group-text bg-white border-0 ps-3"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg></span>
                            <input type="text" class="form-control border-0 border-start shadow-none py-2" placeholder="Search Reviews">
                        </div>

                        <!-- Rating bars -->
                        <h6 class="fw-semibold mb-3">Reviews</h6>
                    <div class="d-flex align-items-center mb-2">
                        <span class="small fw-medium me-1" style="width: 1rem;">5</span>
                        <span class="text-warning small me-2 lh-1">&#9733;</span>
                        <div class="progress flex-grow-1" style="height: 0.5rem;">
                            <div class="progress-bar bg-warning" style="width: 80%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <span class="small fw-medium me-1" style="width: 1rem;">4</span>
                        <span class="text-warning small me-2 lh-1">&#9733;</span>
                        <div class="progress flex-grow-1" style="height: 0.5rem;">
                            <div class="progress-bar bg-warning" style="width: 62%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <span class="small fw-medium me-1" style="width: 1rem;">3</span>
                        <span class="text-warning small me-2 lh-1">&#9733;</span>
                        <div class="progress flex-grow-1" style="height: 0.5rem;">
                            <div class="progress-bar bg-warning" style="width: 20%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <span class="small fw-medium me-1" style="width: 1rem;">2</span>
                        <span class="text-warning small me-2 lh-1">&#9733;</span>
                        <div class="progress flex-grow-1" style="height: 0.5rem;">
                            <div class="progress-bar bg-warning" style="width: 10%"></div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <span class="small fw-medium me-1" style="width: 1rem;">1</span>
                        <span class="text-warning small me-2 lh-1">&#9733;</span>
                        <div class="progress flex-grow-1" style="height: 0.5rem;">
                            <div class="progress-bar bg-warning" style="width: 28%"></div>
                        </div>
                    </div>

                        <button type="button" class="btn btn-success rounded-pill px-3 mt-4">Write Review</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
